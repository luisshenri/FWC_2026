[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fifa-world-cup"
version = "0.1.0"
description = "FIFA World Cup Data Pipeline"
authors = [{name = "Seu Nome"}]
dependencies = [
    "pandas",
    "pyspark",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]